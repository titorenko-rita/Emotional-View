# docker-compose.yml

version: '3.8'

networks:
  monitor-net:
    driver: bridge
    
services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: docker/Frontend/dockerfile
    command: 'npm run dev'
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_started
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  web:
    container_name: api
    build:
      context: .
      dockerfile: docker/API/dockerfile
    command: 'uvicorn main:app --host 0.0.0.0 --reload'
    ports:
      - "8000:8000"
    volumes:
      - model_weights:/weights/
    environment:
      - DATABASE_URL=postgresql:${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - API_REDIS_HOST=${REDIS_HOST}
    depends_on:
      ml:
        condition: service_started
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  ml:
    container_name: ml
    build: 
      context: .
      dockerfile: docker/ML/dockerfile
    command: 'python3 ml.py'
    volumes:
      - model_weights:/weights/
    environment:
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  db:
    container_name: postgres
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - ${POSTGRES_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  redis:
    container_name: redis
    image: redis:7-alpine
    environment:
      - REDIS_HOST=${REDIS_PORT}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    volumes:
      - ./Monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
      - ./alert.rules:/etc/prometheus/alert.rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  nodeexporter:
    image: prom/node-exporter
    container_name: nodeexporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      #- /cgroup:/cgroup:ro #doesn't work on MacOS only for Linux
    restart: unless-stopped
       
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    volumes:
      - ./Monitoring/alertmanager/config.yaml:/etc/alertmanager/config.yaml
    command:
      - '--config.file=/etc/alertmanager/config.yaml'
    restart: unless-stopped
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  grafana:
    image: grafana/grafana:8.3.4 
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./Monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=localhost:8080
      - GF_SERVER_ROOT_URL=http://localhost:8000/grafana
      - GF_SERVER_HTTP_HEADER_ACCESS_CONTROL_ALLOW_ORIGIN=*
      - GF_SERVER_HTTP_HEADER_ACCESS_CONTROL_ALLOW_METHODS=GET,POST
      - GF_SERVER_HTTP_HEADER_ACCESS_CONTROL_ALLOW_HEADERS=accept,authorization,content-type
    restart: unless-stopped
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
volumes:
  postgres_data:
  model_weights:
  prometheus_data: {}
  grafana_data: {}